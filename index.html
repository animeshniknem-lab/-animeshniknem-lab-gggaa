<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Гримуар d20 | Виртуальный стол</title>
    <meta name="description" content="Виртуальный игровой стол для НРИ с 3D кубами, музыкой и мультиплеером.">
    <meta property="og:title" content="Гримуар d20">
    <meta property="og:description" content="Играйте в D&D онлайн с друзьями.">
    <meta property="og:type" content="website">
    <meta name="theme-color" content="#4a0e0e">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎲</text></svg>">
    
    <style>
        :root {
            --bg-color: #0f0f13;
            --panel-bg: rgba(20, 20, 25, 0.85);
            --accent-color: #d4af37; /* Gold */
            --accent-hover: #f9d86c;
            --text-color: #e0e0e0;
            --danger-color: #8b0000;
            --success-color: #2e7d32;
            --fire-orange: #ff4500;
            --fire-yellow: #ffd700;
            --card-bg: rgba(30, 30, 40, 0.9);
            --border-radius: 8px;
            --font-main: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        
        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-main);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
        }

        /* --- Fire Background Effect --- */
        .fire-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 40%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.6;
            overflow: hidden;
        }
        .fire {
            position: absolute;
            bottom: -50px;
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, var(--fire-orange) 0%, rgba(255,69,0,0) 70%);
            border-radius: 50%;
            animation: rise 4s infinite ease-in;
            filter: blur(20px);
        }
        @keyframes rise {
            0% { transform: translateY(0) scale(1); opacity: 0.8; }
            100% { transform: translateY(-400px) scale(1.5); opacity: 0; }
        }

        /* --- Layout --- */
        header {
            background: linear-gradient(180deg, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0) 100%);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
        }

        h1 { margin: 0; font-size: 1.5rem; color: var(--accent-color); text-shadow: 0 0 10px rgba(212, 175, 55, 0.5); }
        
        .controls-top { display: flex; gap: 10px; }
        
        button {
            background: rgba(40, 40, 50, 0.8);
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            padding: 8px 16px;
            border-radius: var(--border-radius);
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
            font-family: inherit;
        }
        button:hover { background: var(--accent-color); color: #000; box-shadow: 0 0 15px var(--accent-color); }
        button:active { transform: scale(0.95); }
        button.danger { border-color: var(--danger-color); color: #ff6b6b; }
        button.danger:hover { background: var(--danger-color); color: white; box-shadow: 0 0 15px var(--danger-color); }

        /* --- Main Area --- */
        #game-area {
            flex: 1;
            position: relative;
            overflow: hidden;
            z-index: 10;
            cursor: grab;
        }
        #game-area:active { cursor: grabbing; }

        /* --- Tokens --- */
        .token {
            position: absolute;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-size: cover;
            background-position: center;
            border: 2px solid var(--accent-color);
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
            text-shadow: 0 0 3px black;
            z-index: 20;
        }
        .token:hover { transform: scale(1.1); z-index: 100; box-shadow: 0 0 15px var(--accent-color); }
        .token.dragging { opacity: 0.8; cursor: grabbing; z-index: 1000; }
        .token.selected { border-color: #00ff00; box-shadow: 0 0 20px #00ff00; }
        .token.enemy { border-color: var(--danger-color); }
        .token.trap { border-color: #800080; border-style: dashed; }

        /* --- Dice Area --- */
        #dice-tray {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            background: var(--panel-bg);
            padding: 15px;
            border-radius: 50px;
            border: 1px solid var(--accent-color);
            backdrop-filter: blur(5px);
            z-index: 100;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .die-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #444, #111);
            border: 2px solid #666;
            color: white;
            font-weight: bold;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            position: relative;
            overflow: hidden;
        }
        .die-btn::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
            transform: rotate(45deg);
            animation: shine 3s infinite;
        }
        @keyframes shine { 0% { transform: translateX(-100%) rotate(45deg); } 100% { transform: translateX(100%) rotate(45deg); } }
        
        .die-btn:hover { transform: translateY(-5px) scale(1.1); border-color: var(--accent-color); background: radial-gradient(circle at 30% 30%, #555, #222); }
        .die-btn:active { transform: scale(0.9); }

        /* --- 3D Dice Animation Container --- */
        #dice-animation-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 200;
            perspective: 1000px;
            display: none; /* Hidden by default */
        }
        .rolling-die {
            position: absolute;
            width: 60px; height: 60px;
            transform-style: preserve-3d;
            animation: rollAnim 1s ease-out forwards;
        }
        .face {
            position: absolute;
            width: 60px; height: 60px;
            background: rgba(20, 20, 20, 0.9);
            border: 2px solid var(--accent-color);
            color: var(--accent-color);
            font-size: 30px;
            display: flex; align-items: center; justify-content: center;
            backface-visibility: hidden;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
        }
        /* Cube faces positioning handled in JS or specific CSS for d6, simplified here for visual effect */
        @keyframes rollAnim {
            0% { transform: rotateX(0) rotateY(0) rotateZ(0) scale(0.5); opacity: 0; }
            20% { opacity: 1; }
            100% { transform: rotateX(720deg) rotateY(360deg) rotateZ(180deg) scale(1); opacity: 1; }
        }

        /* --- Sidebar / Panels --- */
        .sidebar {
            position: absolute;
            top: 70px;
            right: 20px;
            width: 320px;
            max-height: calc(100vh - 140px);
            background: var(--panel-bg);
            border: 1px solid var(--accent-color);
            border-radius: var(--border-radius);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            z-index: 90;
            transition: transform 0.3s;
            box-shadow: -5px 5px 20px rgba(0,0,0,0.5);
        }
        .sidebar.hidden { transform: translateX(350px); }

        .tabs { display: flex; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .tab-btn {
            flex: 1;
            padding: 10px;
            background: transparent;
            border: none;
            color: #aaa;
            cursor: pointer;
            border-radius: var(--border-radius) var(--border-radius) 0 0;
        }
        .tab-btn.active { background: rgba(212, 175, 55, 0.2); color: var(--accent-color); border-bottom: 2px solid var(--accent-color); }

        .tab-content {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: none;
        }
        .tab-content.active { display: block; }

        /* --- Character Cards (New) --- */
        .char-card {
            background: var(--card-bg);
            border: 1px solid #444;
            border-radius: var(--border-radius);
            padding: 10px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: transform 0.2s;
            position: relative;
            overflow: hidden;
        }
        .char-card:hover { transform: translateX(-5px); border-color: var(--accent-color); }
        .char-avatar {
            width: 50px; height: 50px;
            border-radius: 50%;
            background: #333;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px;
            border: 2px solid var(--accent-color);
            flex-shrink: 0;
        }
        .char-info { flex: 1; min-width: 0; }
        .char-name { font-weight: bold; color: var(--accent-color); margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .char-stats { font-size: 0.85rem; color: #ccc; display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; }
        .stat-box { background: rgba(0,0,0,0.3); padding: 2px 4px; border-radius: 4px; text-align: center; }
        .stat-label { font-size: 0.7rem; color: #888; display: block; }
        .stat-val { font-weight: bold; }
        .hp-bar {
            height: 4px;
            background: #333;
            border-radius: 2px;
            margin-top: 5px;
            overflow: hidden;
        }
        .hp-fill { height: 100%; background: var(--success-color); width: 100%; transition: width 0.3s; }
        .hp-fill.low { background: var(--danger-color); }

        /* --- Chat & Logs --- */
        #chat-log {
            height: 200px;
            overflow-y: auto;
            background: rgba(0,0,0,0.3);
            border-radius: 4px;
            padding: 5px;
            font-size: 0.9rem;
            margin-bottom: 10px;
            border: 1px solid #333;
        }
        .log-entry { margin-bottom: 4px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 2px; }
        .log-roll { color: var(--accent-color); }
        .log-sys { color: #888; font-style: italic; }
        .log-private { color: #d488ff; }

        /* --- Forms --- */
        input, select {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            background: rgba(0,0,0,0.5);
            border: 1px solid #444;
            color: white;
            border-radius: 4px;
        }
        input:focus { outline: none; border-color: var(--accent-color); }

        /* --- Toast Notifications --- */
        #toast-container {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }
        .toast {
            background: rgba(20, 20, 20, 0.95);
            border: 1px solid var(--accent-color);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            animation: fadeOut 3s forwards;
            pointer-events: auto;
            text-align: center;
            min-width: 200px;
        }
        @keyframes fadeOut {
            0% { opacity: 0; transform: translateY(-20px); }
            10% { opacity: 1; transform: translateY(0); }
            90% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-20px); }
        }

        /* --- Modal --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
        }
        .modal {
            background: #1a1a20;
            border: 2px solid var(--accent-color);
            padding: 20px;
            border-radius: var(--border-radius);
            width: 90%;
            max-width: 400px;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.2);
        }
        .modal h2 { margin-top: 0; color: var(--accent-color); text-align: center; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #111; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent-color); }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar { width: 100%; right: 0; top: auto; bottom: 80px; max-height: 50vh; border-radius: 20px 20px 0 0; transform: translateY(100%); }
            .sidebar.hidden { transform: translateY(100%); }
            .sidebar.open { transform: translateY(0); }
            #dice-tray { bottom: 10px; gap: 5px; padding: 10px; }
            .die-btn { width: 40px; height: 40px; font-size: 1rem; }
            header { padding: 10px; }
            h1 { font-size: 1.2rem; }
            .controls-top button { padding: 5px 10px; font-size: 0.8rem; }
        }
    </style>
</head>
<body>

    <!-- Fire Background -->
    <div class="fire-container" id="fire-bg"></div>

    <header>
        <h1>📜 Гримуар d20</h1>
        <div class="controls-top">
            <button id="btn-toggle-sidebar" aria-label="Меню">☰ Меню</button>
            <button id="btn-music" aria-label="Музыка">🎵 Вкл</button>
            <button id="btn-role-switch" class="danger" aria-label="Сменить роль">Роль: Игрок</button>
        </div>
    </header>

    <div id="game-area">
        <!-- Tokens will be injected here -->
        <div id="dice-animation-layer"></div>
    </div>

    <div id="dice-tray">
        <div class="die-btn" data-sides="4" title="Бросить d4">d4</div>
        <div class="die-btn" data-sides="6" title="Бросить d6">d6</div>
        <div class="die-btn" data-sides="8" title="Бросить d8">d8</div>
        <div class="die-btn" data-sides="10" title="Бросить d10">d10</div>
        <div class="die-btn" data-sides="12" title="Бросить d12">d12</div>
        <div class="die-btn" data-sides="20" title="Бросить d20" style="border-color: var(--danger-color); color: #ff6b6b;">d20</div>
        <div class="die-btn" data-sides="100" title="Бросить d100">%</div>
    </div>

    <aside class="sidebar hidden" id="sidebar">
        <div class="tabs">
            <button class="tab-btn active" data-tab="chars">Персонажи</button>
            <button class="tab-btn" data-tab="tools">Инструменты</button>
            <button class="tab-btn" data-tab="settings">Настройки</button>
        </div>

        <!-- Characters Tab -->
        <div id="tab-chars" class="tab-content active">
            <h3>Активные персонажи</h3>
            <div id="char-list">
                <!-- Character Cards go here -->
                <div style="text-align:center; color:#666; padding:20px;">Нет активных персонажей</div>
            </div>
            <hr style="border-color:#333; margin: 15px 0;">
            <h4>Добавить персонажа</h4>
            <input type="text" id="new-char-name" placeholder="Имя героя">
            <select id="new-char-class">
                <option value="Fighter">Воин</option>
                <option value="Wizard">Маг</option>
                <option value="Rogue">Плут</option>
                <option value="Cleric">Жрец</option>
                <option value="Custom">Свой...</option>
            </select>
            <button id="btn-add-char" style="width:100%">Создать лист</button>
        </div>

        <!-- Tools Tab (DM Only mostly) -->
        <div id="tab-tools" class="tab-content">
            <div id="dm-controls" style="display:none;">
                <h3>Мастерская</h3>
                <button id="btn-add-token" style="width:100%; margin-bottom:10px;">➕ Добавить фишку</button>
                <button id="btn-add-trap" style="width:100%; margin-bottom:10px; border-color:#800080; color:#d8bfd8;">⚠️ Ловушка</button>
                <button id="btn-clear-board" class="danger" style="width:100%">Очистить стол</button>
                <div style="margin-top:15px; font-size:0.9rem; color:#aaa;">
                    <p>💡 <strong>Совет:</strong> Перетаскивайте любые фишки, чтобы двигать монстров или союзников.</p>
                </div>
            </div>
            <div id="player-tools">
                <h3>Заметки</h3>
                <textarea id="player-notes" style="width:100%; height:150px; background:#222; color:#eee; border:1px solid #444; padding:5px;" placeholder="Ваши личные заметки..."></textarea>
            </div>
        </div>

        <!-- Settings / Chat -->
        <div id="tab-settings" class="tab-content">
            <h3>Чат и Логи</h3>
            <div id="chat-log"></div>
            
            <h3>Сеть</h3>
            <div id="network-status" style="color:#aaa; font-size:0.9rem; margin-bottom:10px;">Статус: Оффлайн</div>
            <input type="text" id="room-id-input" placeholder="ID комнаты">
            <div style="display:flex; gap:5px;">
                <button id="btn-create-room" style="flex:1">Создать</button>
                <button id="btn-join-room" style="flex:1">Войти</button>
            </div>
            <button id="btn-copy-link" style="width:100%; margin-top:5px;">Копировать ссылку</button>
        </div>
    </aside>

    <div id="toast-container"></div>

    <!-- Modals -->
    <div class="modal-overlay" id="modal-token">
        <div class="modal">
            <h2>Новая фишка</h2>
            <label>Тип:</label>
            <select id="token-type">
                <option value="player">Персонаж</option>
                <option value="enemy">Враг / Монстр</option>
                <option value="npc">NPC</option>
                <option value="trap">Ловушка</option>
                <option value="object">Объект</option>
            </select>
            <label>Имя / Описание:</label>
            <input type="text" id="token-name" placeholder="Гоблин, Сундук...">
            <label>Эмодзи / Цвет:</label>
            <input type="text" id="token-icon" placeholder="👹 или #FF0000" value="👾">
            <div class="modal-actions">
                <button class="danger" onclick="closeModal('modal-token')">Отмена</button>
                <button id="confirm-token">Создать</button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <script>
        /**
         * GRIMOIRE d20 - Core Logic
         * Optimized for performance and modularity while keeping all features.
         */

        // --- State Management ---
        const state = {
            isDM: false,
            roomId: null,
            peer: null,
            conn: null,
            tokens: [], // {id, x, y, type, name, icon, ownerId}
            characters: [], // {id, name, class, hp, maxHp, stats}
            audioContext: null,
            isMusicOn: false,
            draggedTokenId: null,
            dragOffset: {x:0, y:0}
        };

        // --- DOM Elements ---
        const els = {
            gameArea: document.getElementById('game-area'),
            sidebar: document.getElementById('sidebar'),
            charList: document.getElementById('char-list'),
            chatLog: document.getElementById('chat-log'),
            diceLayer: document.getElementById('dice-animation-layer'),
            toastContainer: document.getElementById('toast-container'),
            dmControls: document.getElementById('dm-controls'),
            roleBtn: document.getElementById('btn-role-switch')
        };

        // --- Initialization ---
        function init() {
            createFireBackground();
            setupEventListeners();
            loadLocalData();
            showToast("Добро пожаловать в Гримуар d20!");
            
            // Default DM check (simple toggle for demo, in real app would be auth)
            toggleRole(false); 
        }

        function createFireBackground() {
            const container = document.getElementById('fire-bg');
            for(let i=0; i<20; i++) {
                const fire = document.createElement('div');
                fire.className = 'fire';
                fire.style.left = Math.random() * 100 + '%';
                fire.style.animationDelay = Math.random() * 4 + 's';
                fire.style.width = (50 + Math.random() * 100) + 'px';
                fire.style.height = fire.style.width;
                container.appendChild(fire);
            }
        }

        // --- Event Listeners ---
        function setupEventListeners() {
            // Sidebar Toggle
            document.getElementById('btn-toggle-sidebar').addEventListener('click', () => {
                els.sidebar.classList.toggle('hidden');
                if(window.innerWidth <= 768) {
                    els.sidebar.classList.toggle('open');
                }
            });

            // Tabs
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                    e.target.classList.add('active');
                    document.getElementById(`tab-${e.target.dataset.tab}`).classList.add('active');
                });
            });

            // Dice Rolling
            document.querySelectorAll('.die-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const sides = parseInt(btn.dataset.sides);
                    rollDice(sides);
                });
            });

            // Drag & Drop Logic (Global on Game Area)
            els.gameArea.addEventListener('mousedown', handleDragStart);
            els.gameArea.addEventListener('mousemove', handleDragMove);
            els.gameArea.addEventListener('mouseup', handleDragEnd);
            
            // Touch support
            els.gameArea.addEventListener('touchstart', handleTouchStart, {passive: false});
            els.gameArea.addEventListener('touchmove', handleTouchMove, {passive: false});
            els.gameArea.addEventListener('touchend', handleDragEnd);

            // DM Controls
            document.getElementById('btn-add-token').addEventListener('click', () => openModal('modal-token'));
            document.getElementById('confirm-token').addEventListener('click', addTokenFromModal);
            document.getElementById('btn-add-trap').addEventListener('click', () => {
                addToken('trap', 'Ловушка', '⚠️');
                closeModal('modal-token');
            });
            document.getElementById('btn-clear-board').addEventListener('click', () => {
                if(confirm('Удалить все фишки со стола?')) {
                    state.tokens = [];
                    renderTokens();
                    broadcast({type: 'clear_board'});
                }
            });

            // Character Creation
            document.getElementById('btn-add-char').addEventListener('click', createCharacterCard);

            // Role Switching
            els.roleBtn.addEventListener('click', () => toggleRole(!state.isDM));

            // Music
            document.getElementById('btn-music').addEventListener('click', toggleMusic);

            // Network
            document.getElementById('btn-create-room').addEventListener('click', createRoom);
            document.getElementById('btn-join-room').addEventListener('click', joinRoom);
            document.getElementById('btn-copy-link').addEventListener('click', copyLink);
        }

        // --- Core Logic: Roles & Permissions ---
        function toggleRole(isDM) {
            state.isDM = isDM;
            els.roleBtn.textContent = isDM ? "Роль: Мастер" : "Роль: Игрок";
            els.roleBtn.classList.toggle('danger', !isDM);
            els.dmControls.style.display = isDM ? 'block' : 'none';
            showToast(isDM ? "Режим Мастера активирован" : "Режим Игрока");
            renderTokens(); // Re-render to update drag permissions visually if needed
        }

        // --- Core Logic: Tokens & Dragging ---
        function addToken(type, name, icon) {
            const id = 'tok_' + Date.now() + Math.random().toString(36).substr(2, 5);
            const token = {
                id,
                type,
                name: name || type,
                icon: icon || '🔹',
                x: 50 + Math.random() * 200,
                y: 50 + Math.random() * 200,
                ownerId: state.isDM ? 'dm' : 'player_' + Math.random()
            };
            state.tokens.push(token);
            renderTokenElement(token);
            broadcast({type: 'add_token', data: token});
        }

        function addTokenFromModal() {
            const type = document.getElementById('token-type').value;
            const name = document.getElementById('token-name').value;
            const icon = document.getElementById('token-icon').value;
            addToken(type, name, icon);
            closeModal('modal-token');
            // Reset form
            document.getElementById('token-name').value = '';
        }

        function renderTokens() {
            // Clear existing (optimization: could diff, but clear is safe for now)
            document.querySelectorAll('.token').forEach(el => el.remove());
            state.tokens.forEach(renderTokenElement);
        }

        function renderTokenElement(token) {
            const el = document.createElement('div');
            el.className = `token ${token.type === 'enemy' ? 'enemy' : ''} ${token.type === 'trap' ? 'trap' : ''}`;
            el.id = token.id;
            el.style.left = token.x + 'px';
            el.style.top = token.y + 'px';
            el.textContent = token.icon.length > 2 ? '' : token.icon; // Text or BG
            if(token.icon.length > 2) el.style.backgroundImage = `url(${token.icon})`; // Simple URL check logic omitted for brevity, using emoji primarily
            el.title = `${token.name} (${token.type})`;
            
            // Permission Check Visuals
            if (!state.isDM && token.type !== 'player' && token.ownerId !== 'player') {
                el.style.opacity = '0.7';
                el.style.cursor = 'not-allowed';
            }

            els.gameArea.appendChild(el);
        }

        // Drag Handlers
        function handleDragStart(e) {
            if (e.target.classList.contains('token')) {
                const tokenEl = e.target;
                const tokenData = state.tokens.find(t => t.id === tokenEl.id);
                
                // LOGIC CHECK: Can I move this?
                // DM can move ANYTHING. Players can only move their own or 'player' type tokens.
                let canMove = false;
                if (state.isDM) canMove = true;
                else if (tokenData.type === 'player' || tokenData.ownerId.startsWith('player_')) canMove = true;

                if (!canMove) {
                    showToast("❌ Только Мастер может двигать эту фишку!", true);
                    return;
                }

                state.draggedTokenId = tokenEl.id;
                tokenEl.classList.add('dragging');
                
                const rect = tokenEl.getBoundingClientRect();
                const areaRect = els.gameArea.getBoundingClientRect();
                
                // Calculate offset relative to the token's top-left
                state.dragOffset.x = e.clientX - rect.left;
                state.dragOffset.y = e.clientY - rect.top;
            }
        }

        function handleDragMove(e) {
            if (!state.draggedTokenId) return;
            e.preventDefault();

            const tokenEl = document.getElementById(state.draggedTokenId);
            const areaRect = els.gameArea.getBoundingClientRect();
            
            let newX = e.clientX - areaRect.left - state.dragOffset.x;
            let newY = e.clientY - areaRect.top - state.dragOffset.y;

            // Boundary checks
            newX = Math.max(0, Math.min(newX, areaRect.width - 50));
            newY = Math.max(0, Math.min(newY, areaRect.height - 50));

            tokenEl.style.left = newX + 'px';
            tokenEl.style.top = newY + 'px';
        }

        function handleDragEnd() {
            if (!state.draggedTokenId) return;
            
            const tokenEl = document.getElementById(state.draggedTokenId);
            tokenEl.classList.remove('dragging');
            
            const newX = parseFloat(tokenEl.style.left);
            const newY = parseFloat(tokenEl.style.top);
            
            // Update State
            const tokenData = state.tokens.find(t => t.id === state.draggedTokenId);
            if (tokenData) {
                tokenData.x = newX;
                tokenData.y = newY;
                broadcast({type: 'move_token', data: {id: tokenData.id, x: newX, y: newY}});
            }

            state.draggedTokenId = null;
        }

        // Touch Support wrappers
        function handleTouchStart(e) {
            if(e.touches.length === 1) {
                const touch = e.touches[0];
                // Create a fake mouse event for the existing logic
                const mouseEvent = new MouseEvent('mousedown', {
                    clientX: touch.clientX,
                    clientY: touch.clientY
                });
                handleDragStart(mouseEvent);
            }
        }
        function handleTouchMove(e) {
            if(e.touches.length === 1 && state.draggedTokenId) {
                e.preventDefault(); // Prevent scrolling
                const touch = e.touches[0];
                const mouseEvent = new MouseEvent('mousemove', {
                    clientX: touch.clientX,
                    clientY: touch.clientY
                });
                handleDragMove(mouseEvent);
            }
        }

        // --- Core Logic: Dice ---
        function rollDice(sides) {
            const result = Math.floor(Math.random() * sides) + 1;
            const isCrit = (sides === 20 && result === 20);
            const isFail = (sides === 20 && result === 1);
            
            // Visual Animation
            animateDiceRoll(sides, result, isCrit);
            
            // Log
            const msg = `Бросок d${sides}: <strong>${result}</strong> ${isCrit ? '🔥 КРИТ!' : ''} ${isFail ? '💀 ПРОМАХ!' : ''}`;
            addLog(msg, isCrit ? 'log-roll' : '');
            broadcast({type: 'roll', data: {sides, result, isCrit}});
        }

        function animateDiceRoll(sides, result, isCrit) {
            els.diceLayer.style.display = 'block';
            els.diceLayer.innerHTML = '';
            
            const die = document.createElement('div');
            die.className = 'rolling-die';
            die.style.left = '50%';
            die.style.top = '40%';
            die.style.transform = 'translate(-50%, -50%)';
            
            const face = document.createElement('div');
            face.className = 'face';
            face.textContent = result;
            if(isCrit) {
                face.style.borderColor = '#ff0000';
                face.style.color = '#ff0000';
                face.style.boxShadow = '0 0 30px red';
            }
            
            die.appendChild(face);
            els.diceLayer.appendChild(die);

            setTimeout(() => {
                els.diceLayer.style.display = 'none';
            }, 1200);
        }

        // --- Core Logic: Characters (Cards) ---
        function createCharacterCard() {
            const name = document.getElementById('new-char-name').value;
            const charClass = document.getElementById('new-char-class').value;
            
            if(!name) return showToast("Введите имя!", true);

            const char = {
                id: 'char_' + Date.now(),
                name,
                class: charClass,
                hp: 20,
                maxHp: 20,
                stats: { str: 10, dex: 10, int: 10 }
            };
            state.characters.push(char);
            renderCharacter(char);
            
            // Auto add a token for this character? Optional.
            // addToken('player', name, '🧙‍♂️'); 
            
            document.getElementById('new-char-name').value = '';
            showToast(`Персонаж ${name} создан!`);
        }

        function renderCharacter(char) {
            // Remove "empty" message if exists
            const emptyMsg = els.charList.querySelector('div[style*="text-align:center"]');
            if(emptyMsg) emptyMsg.remove();

            const card = document.createElement('div');
            card.className = 'char-card';
            card.id = char.id;
            
            const avatarIcon = char.class === 'Wizard' ? '🧙' : char.class === 'Fighter' ? '⚔️' : '🛡️';
            
            card.innerHTML = `
                <div class="char-avatar">${avatarIcon}</div>
                <div class="char-info">
                    <div class="char-name">${char.name} <small style="color:#888">(${char.class})</small></div>
                    <div class="char-stats">
                        <div class="stat-box"><span class="stat-label">СИЛ</span><span class="stat-val">${char.stats.str}</span></div>
                        <div class="stat-box"><span class="stat-label">ЛОВ</span><span class="stat-val">${char.stats.dex}</span></div>
                        <div class="stat-box"><span class="stat-label">ИНТ</span><span class="stat-val">${char.stats.int}</span></div>
                    </div>
                    <div class="hp-bar"><div class="hp-fill" style="width: 100%"></div></div>
                </div>
            `;
            
            // Simple HP click interaction
            card.querySelector('.hp-bar').addEventListener('click', () => {
                char.hp = Math.max(0, char.hp - 1);
                updateHPVisual(card, char);
            });

            els.charList.appendChild(card);
        }

        function updateHPVisual(cardEl, char) {
            const pct = (char.hp / char.maxHp) * 100;
            const bar = cardEl.querySelector('.hp-fill');
            bar.style.width = pct + '%';
            if(pct < 30) bar.classList.add('low');
            else bar.classList.remove('low');
        }

        // --- Utilities ---
        function showToast(msg, isError = false) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = msg;
            if(isError) toast.style.borderColor = 'red';
            els.toastContainer.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function addLog(msg, className = '') {
            const div = document.createElement('div');
            div.className = `log-entry ${className}`;
            div.innerHTML = `[${new Date().toLocaleTimeString()}] ${msg}`;
            els.chatLog.appendChild(div);
            els.chatLog.scrollTop = els.chatLog.scrollHeight;
        }

        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        function toggleMusic() {
            // Placeholder for actual audio implementation
            state.isMusicOn = !state.isMusicOn;
            document.getElementById('btn-music').textContent = state.isMusicOn ? "🎵 Выкл" : "🎵 Вкл";
            showToast(state.isMusicOn ? "Музыка включена (демо)" : "Музыка выключена");
        }

        function loadLocalData() {
            // Load from localStorage if needed
            const saved = localStorage.getItem('grimoire_chars');
            if(saved) {
                state.characters = JSON.parse(saved);
                state.characters.forEach(renderCharacter);
            }
        }

        // --- Networking (PeerJS Stub) ---
        function createRoom() {
            if(!window.Peer) return showToast("Библиотека PeerJS не загружена", true);
            
            state.peer = new Peer();
            state.peer.on('open', (id) => {
                state.roomId = id;
                document.getElementById('room-id-input').value = id;
                document.getElementById('network-status').textContent = `Статус: Хост (${id})`;
                document.getElementById('network-status').style.color = '#0f0';
                showToast(`Комната создана: ${id}`);
                addLog(`Создана комната: ${id}`, 'log-sys');
            });

            state.peer.on('connection', (conn) => {
                setupConnection(conn);
                showToast("Игрок подключился!");
            });
        }

        function joinRoom() {
            const roomId = document.getElementById('room-id-input').value;
            if(!roomId) return showToast("Введите ID комнаты", true);
            
            state.peer = new Peer();
            state.peer.on('open', () => {
                const conn = state.peer.connect(roomId);
                setupConnection(conn);
            });
        }

        function setupConnection(conn) {
            state.conn = conn;
            conn.on('open', () => {
                document.getElementById('network-status').textContent = "Статус: Онлайн";
                document.getElementById('network-status').style.color = '#0f0';
                showToast("Подключено к сети!");
                
                // Send current state to new peer
                if(state.isDM) {
                    setTimeout(() => {
                        conn.send({type: 'init_state', data: {tokens: state.tokens}});
                    }, 500);
                }
            });

            conn.on('data', (data) => handleNetworkData(data));
        }

        function broadcast(data) {
            if(state.conn && state.conn.open) {
                state.conn.send(data);
            }
        }

        function handleNetworkData(data) {
            switch(data.type) {
                case 'init_state':
                    state.tokens = data.data.tokens;
                    renderTokens();
                    break;
                case 'add_token':
                    state.tokens.push(data.data);
                    renderTokenElement(data.data);
                    break;
                case 'move_token':
                    const t = state.tokens.find(x => x.id === data.data.id);
                    if(t) {
                        t.x = data.data.x;
                        t.y = data.data.y;
                        const el = document.getElementById(t.id);
                        if(el) {
                            el.style.left = t.x + 'px';
                            el.style.top = t.y + 'px';
                        }
                    }
                    break;
                case 'roll':
                    addLog(`Друг бросил d${data.data.sides}: ${data.data.result}`, 'log-roll');
                    break;
                case 'clear_board':
                    state.tokens = [];
                    renderTokens();
                    break;
            }
        }

        function copyLink() {
            const url = window.location.href.split('?')[0] + '?room=' + (state.roomId || '');
            navigator.clipboard.writeText(url).then(() => showToast("Ссылка скопирована!"));
        }

        // Start
        window.addEventListener('DOMContentLoaded', init);

    </script>
</body>
