<style>
:root{--bg0:#120d08;--panel:#241b11;--ink:#e9dcb8;--dim:#a8987a;--line:#3a2c17;--gold:#d9a441;--gold-b:#f2c14e;--gold-d:#8a6423;--ember:#e2622b;--blood:#c0392b;--arcane:#4f7fd1;--arcane-b:#7fb0e8;--parch:#e8d5a3;--cell:48px;--disp:'Ruslan Display',serif;--body:'Alegreya',Georgia,serif;--hand:'Neucha',cursive}
*{margin:0;padding:0;box-sizing:border-box}html{scroll-behavior:smooth}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
body{background:var(--bg0);color:var(--ink);font:400 16px/1.55 var(--body);overflow-x:hidden}
.skip-link{position:absolute;top:-40px;left:0;background:var(--gold);color:#000;padding:8px 16px;z-index:1000;text-decoration:none;font-weight:700}.skip-link:focus{top:0}
.side{position:fixed;left:0;top:0;bottom:0;width:238px;z-index:30;display:flex;flex-direction:column;background:linear-gradient(180deg,#1f170e,#160f08);border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;padding:20px 18px 16px;cursor:pointer;text-decoration:none}
.brand b{font:400 20px var(--disp);color:var(--parch)}.brand span{font:400 15px var(--hand);color:var(--gold)}
.nav{flex:1;overflow-y:auto;padding:6px 0 12px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;padding:10px 16px;border:0;border-left:3px solid transparent;background:none;color:var(--dim);font:500 15px var(--body);cursor:pointer;text-align:left;transition:.22s}
.nav button:hover{color:var(--gold-b);background:linear-gradient(90deg,rgba(217,164,65,.12),transparent)}
.nav button.active{color:var(--gold-b);border-left-color:var(--gold);background:linear-gradient(90deg,rgba(217,164,65,.14),transparent)}
.shell{margin-left:238px;position:relative;z-index:5;min-height:100vh}
.top{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:13px 30px;background:linear-gradient(180deg,rgba(18,13,8,.94),rgba(18,13,8,.78));backdrop-filter:blur(6px);border-bottom:1px solid #332613}
.crumb{font:400 22px var(--disp);color:var(--parch)}
.btn{font:700 14px var(--body);letter-spacing:.03em;padding:9px 18px;border-radius:7px;cursor:pointer;border:1px solid transparent;transition:.2s}
.btn.gold{background:linear-gradient(180deg,#f2c14e,#c98f2b);color:#241703;border-color:var(--gold-d)}
main{padding:10px 30px 90px;max-width:1240px}
.page-head h2{font:400 34px var(--disp);color:var(--parch);margin-bottom:20px}
.toast-wrap{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{background:#1c140b;border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:8px;padding:12px 16px;font:400 14px var(--hand);color:var(--ink);box-shadow:0 8px 20px -10px #000;animation:slideIn .3s ease}
.toast.crit{border-left-color:#ffd97a}.toast.fail{border-left-color:var(--blood)}
@keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
@media(max-width:768px){.side{width:100%;height:auto;bottom:auto;position:relative}.shell{margin-left:0}.nav{display:flex;overflow-x:auto;padding:10px}.nav button{white-space:nowrap;width:auto}}
</style>
<script>
let PeerJS=null;
async function loadPeerJS(){if(PeerJS)return PeerJS;return new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js';s.onload=()=>{PeerJS=window.Peer;resolve(PeerJS);};s.onerror=()=>reject(new Error('Failed to load PeerJS'));document.head.appendChild(s);});}
const $=sel=>document.querySelector(sel);const $$=sel=>[...document.querySelectorAll(sel)];const uid=()=>Math.random().toString(36).slice(2,10);const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const toast=(msg,kind='')=>{const w=$('#toastWrap');const el=document.createElement('div');el.className='toast '+kind;el.textContent=msg;w.appendChild(el);setTimeout(()=>{el.style.opacity='0';},2800);setTimeout(()=>el.remove(),3200);};
const S={session:null,rolls:[],tokens:[],secrets:[],tracks:[],trackData:{},music:{trackId:null,playing:false,time:0},terms:[],mapData:null,mapName:'',roomPeers:[],revealedForMe:[],scale:{unit:'ft',cell:5}};
const ROLENAME={dm:'Мастер',pl:'Игрок',guest:'Гость'};
const DB={db:null,async open(){return new Promise((resolve,reject)=>{const req=indexedDB.open('GrimoireDB',3);req.onupgradeneeded=e=>{const db=e.target.result;['rolls','chars','items','quests','notes','tracks','maps','tokens','secrets'].forEach(store=>{if(!db.objectStoreNames.contains(store))db.createObjectStore(store,{keyPath:'id'});});if(!db.objectStoreNames.contains('kv'))db.createObjectStore('kv',{keyPath:'id'});});req.onsuccess=()=>{this.db=req.result;resolve();};req.onerror=()=>reject(req.error);});},async put(store,obj){return new Promise((resolve,reject)=>{const tx=this.db.transaction(store,'readwrite');tx.objectStore(store).put(obj);tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error);});},async get(store,id){return new Promise((resolve,reject)=>{const tx=this.db.transaction(store,'readonly');const req=tx.objectStore(store).get(id);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});},async del(store,id){return new Promise((resolve,reject)=>{const tx=this.db.transaction(store,'readwrite');tx.objectStore(store).delete(id);tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error);});},async all(store){return new Promise((resolve,reject)=>{const tx=this.db.transaction(store,'readonly');const req=tx.objectStore(store).getAll();req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});}};
const PRESENCE={peer:null,isHost:false,list:[],hb:null,watch:null,retries:0,start(who,role){this.stop();this.who=who;this.role=role;this.list=[];this.retries=0;this.tryHost();},stop(){clearInterval(this.hb);clearTimeout(this.watch);this.hb=null;this.watch=null;try{this.peer&&this.peer.destroy();}catch(e){}this.peer=null;this.isHost=false;this.list=[];renderPresence();},async tryHost(){try{const Peer=await loadPeerJS();this.peer=new Peer('grimoire-d20-lobby-v1',{debug:0});}catch(e){this.tryJoin();return;}this.peer.on('open',()=>{this.isHost=true;this.retries=0;this.list=[{name:this.who,role:this.role,me:true}];renderPresence();this.peer.on('connection',c=>{c.on('open',()=>{c.on('data',m=>{if(m&&m.t==='hi'){const ex=this.list.find(x=>x.name===m.who);if(ex)ex.last=Date.now();else this.list.push({name:m.who,role:m.role,last:Date.now()});c._who=m.who;this.broadcast();renderPresence();}});c.on('close',()=>{this.list=this.list.filter(x=>x.name!==c._who);this.broadcast();renderPresence();});});});this.hb=setInterval(()=>this.broadcast(),5000);this.watch=setInterval(()=>this.prune(),4000);});this.peer.on('error',()=>this.tryJoin());},async tryJoin(){try{if(this.peer){try{this.peer.destroy();}catch(e){}}const Peer=await loadPeerJS();this.peer=new Peer({debug:0});}catch(e){this.giveUp();return;}this.peer.on('open',()=>{const conn=this.peer.connect('grimoire-d20-lobby-v1',{reliable:true});this.conn=conn;let opened=false;conn.on('open',()=>{opened=true;this.retries=0;conn.send({t:'hi',who:this.who,role:this.role});});conn.on('data',m=>{if(m&&m.t==='list'){this.list=m.list.map(x=>({...x,me:x.name===this.who}));renderPresence();}});conn.on('close',()=>{this.list=[];renderPresence();setTimeout(()=>{if(S.session)this.reconnect();},2500);});this.watch=setTimeout(()=>{if(!opened){this.retries++;if(this.retries<3)this.tryHost();else this.giveUp();}},3000);});this.peer.on('error',()=>{this.retries++;if(this.retries<3)setTimeout(()=>this.tryHost(),1500);else this.giveUp();});},reconnect(){clearTimeout(this.watch);this.tryJoin();},giveUp(){this.list=[{name:this.who,role:this.role,me:true,offline:true}];renderPresence();},broadcast(){if(!this.isHost||!this.peer)return;const payload={t:'list',list:this.list.map(x=>({name:x.name,role:x.role}))};this.peer.connections&&Object.values(this.peer.connections).forEach(arr=>arr.forEach(c=>{if(c.open)c.send(payload);}));},prune(){const now=Date.now();const before=this.list.length;this.list=this.list.filter(x=>x.me||(now-(x.last||now))<15000);if(this.list.length!==before){this.broadcast();renderPresence();}}};
function renderPresence(){const seen={};const rows=[];if(S.session)seen[S.session.name]=1;PRESENCE.list.forEach(x=>{if(!seen[x.name]){seen[x.name]=1;rows.push({name:x.name,role:x.role,online:!x.offline,me:!!x.me});}});S.roomPeers.forEach(nm=>{if(!seen[nm]){seen[nm]=1;rows.push({name:nm,role:'pl',online:true,me:false});}});if(S.session)rows.unshift({name:S.session.name,role:S.session.role,online:true,me:true});const online=rows.filter(r=>r.online).length;$('#presCount').textContent='в таверне: '+(rows.length?online:'—');$('#presLive').className='live'+(online>0?'':' off');$('#presList').innerHTML=rows.length?rows.map(r=>`<div class="pres-row"><i class="${r.online?'on':'off'}"></i>${esc(r.name)}${r.me?' <span style="color:#6b5836">(ты)</span>':''}<span class="pr">${ROLENAME[r.role]||''}</span></div>`).join(''):'<div class="pres-empty">никого не видно</div>';}
$('#presBtn').onclick=()=>{$('#pres').classList.toggle('open');};
document.addEventListener('click',e=>{if(!e.target.closest('#pres'))$('#pres').classList.remove('open');});
(async function boot(){try{await DB.open();}catch(e){toast('⚠ IndexedDB недоступен','fail');}toast('🎲 Гримуар готов к приключениям!','crit');})();
</script>
